# Gera a cobrinha a partir do gráfico de contribuições REAL do perfil e publica no branch `output`.
# Antes, o README mostrava uma imagem estática enviada uma vez (uma foto congelada do gráfico),
# por isso a cobra nunca batia com os commits. Agora ela é refeita a cada 12 h, a cada push na main
# e sob demanda (Actions → snake → Run workflow).
name: snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar a cobrinha (cores do CharyRick)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#b07828&color_dots=#ebedf0,#d9c8f0,#a77fe0,#7b4fd0,#3a265f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffd448&color_dots=#161b22,#3a265f,#7b4fd0,#ce60dc,#54d4e8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "snake: atualiza a partir do gráfico de contribuições"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
